<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="left-section">
          <img src="logo.png" alt="" class="logo" />
          <div class="content">
            <h6 class="type">POKEMON GEN 1</h6>
            <br />
            <h1 class="name">Pikachu</h1>
            <br />
            <p class="description">
              Pikachu is an Electric-type Pokémon introduced <br />in Generation
              I. Pikachu are small, chubby,<br />
              and incredibly cute mouse-like Pokémon. <br />
              They are almost completely covered by <br />yellow fur.
            </p>
            <br />
            <br />
            <h4 class="footer-heading">-01 / 08</h4>
            <img
              src="image-removebg-preview (1).png"
              alt=""
              class="footer-logo"
            />
          </div>
        </div>

        <div class="right-section">
          <div class="menu">
            <i class="ri-menu-line"></i>
          </div>

          <img src="image-removebg-preview.png" alt="" class="pikachu" />

          <div class="dots">
            <span class="active"></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
